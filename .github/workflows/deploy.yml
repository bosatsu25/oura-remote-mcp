name: deploy

# Manual only. Deploy from a clean main after CI is green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      # Perimeter tests on the Workers runtime: the only tests that exercise the real
      # OAuthProvider wiring (a misconfigured provider fails every request).
      - run: npm run test:workers
      # CLOUDFLARE_API_TOKEN must be scoped to: Workers Scripts:Edit, Workers KV Storage:Edit,
      # for this account only. Never use a Global API Key.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
