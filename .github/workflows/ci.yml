name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs raise only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported major on Linux (the deploy job uses the same).
          - os: ubuntu-latest
            node: 22
          # The owner develops on Windows with Node 24 / npm 11.
          - os: windows-latest
            node: 24
    steps:
      # SECURITY.md: pin these to commit SHAs (Dependabot keeps them current).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:workers

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API on pull_request events.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Results are uploaded to code scanning, so alerts open and close in the Security tab
    # (an alert only closes when a later upload no longer contains it). The job also
    # fails on any finding and prints each as an annotation, so CI blocks it either way.
    permissions:
      contents: read
      # Required by codeql-action in private repositories (reads the workflow run).
      actions: read
      # Upload SARIF to code scanning.
      security-events: write
    env:
      # On pull_request events codeql-action otherwise reports only alerts on changed
      # lines ("diff-informed queries"), so a finding in untouched code passes the PR
      # and first fails on main. The codebase is small: analyse all of it every time.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      - name: Fail on CodeQL findings
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF output"
            exit 1
          fi
          jq -r -s '.[].runs[].results[]? |
            "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "unknown"),line=\(.locations[0].physicalLocation.region.startLine // 1)::\(.ruleId): \(.message.text | gsub("[\r\n]+"; " "))"' "${files[@]}"
          count=$(jq -s '[.[].runs[].results[]?] | length' "${files[@]}")
          echo "CodeQL findings: ${count}"
          [ "${count}" -eq 0 ]

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high
