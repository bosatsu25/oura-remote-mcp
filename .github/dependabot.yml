version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep @types/node on the lowest supported Node major (engines floor is 22.18, CI runs 22),
      # so code using newer Node APIs fails typecheck instead of at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler", "agents", "vitest"]
      mcp:
        patterns: ["@modelcontextprotocol/*"]
      # Remaining dev tooling (typescript, tsx, @types/node 22.x, ...): one PR per week.
      # Majors stay separate so each one gets its own review.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
