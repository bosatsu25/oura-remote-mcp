version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler", "agents", "vitest"]
      mcp:
        patterns: ["@modelcontextprotocol/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
